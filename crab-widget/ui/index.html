<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crab Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" class="mood-calm" title="">
    <svg id="rings" viewBox="0 0 150 150" width="150" height="150" aria-hidden="true">
      <circle class="backdrop" cx="75" cy="75" r="73"/>
      <circle class="track" cx="75" cy="75" r="68"/>
      <circle class="track" cx="75" cy="75" r="61"/>
      <circle class="track" cx="75" cy="75" r="54"/>
      <circle id="ring-claude" class="ring" cx="75" cy="75" r="68"/>
      <circle id="ring-cpu" class="ring" cx="75" cy="75" r="61"/>
      <circle id="ring-ram" class="ring" cx="75" cy="75" r="54"/>
    </svg>

    <svg id="crab" viewBox="-8 -22 106 82" width="85" height="66" shape-rendering="crispEdges" aria-hidden="true">
      <g id="smoke">
        <rect x="24" y="-12" width="6" height="6"/>
        <rect x="42" y="-18" width="6" height="6"/>
        <rect x="60" y="-12" width="6" height="6"/>
      </g>
      <g id="mover">
        <g class="legs">
          <rect class="leg skin" x="16" y="36" width="6" height="16"/>
          <rect class="leg skin" x="28" y="36" width="6" height="16"/>
          <rect class="leg skin" x="56" y="36" width="6" height="16"/>
          <rect class="leg skin" x="68" y="36" width="6" height="16"/>
        </g>
        <g id="bob">
          <g id="puff">
            <rect class="arm arm-l skin" x="0" y="14" width="12" height="12"/>
            <rect class="arm arm-r skin" x="78" y="14" width="12" height="12"/>
            <rect class="body skin" x="10" y="0" width="70" height="38"/>
            <g class="eyes">
              <rect class="eye" x="24" y="10" width="6" height="13"/>
              <rect class="eye" x="60" y="10" width="6" height="13"/>
            </g>
          </g>
          <rect class="sweat sweat-a" x="83" y="-2" width="4" height="6"/>
          <rect class="sweat sweat-b" x="3" y="-2" width="4" height="6"/>
        </g>
        <g id="laptop">
          <rect class="lap-lid" x="27" y="26" width="36" height="20"/>
          <rect class="lap-logo" x="42" y="33" width="6" height="6"/>
          <rect class="lap-base" x="19" y="46" width="52" height="5"/>
          <rect class="hand skin" x="6" y="38" width="14" height="8"/>
          <rect class="hand skin" x="70" y="38" width="14" height="8"/>
        </g>
      </g>
      <g id="bubble">
        <rect class="bub" x="46" y="-24" width="36" height="15"/>
        <rect class="bub bub-tail" x="52" y="-9" width="6" height="5"/>
        <rect class="bub bub-think" x="50" y="-8" width="5" height="4"/>
        <rect class="bub bub-think" x="44" y="-3" width="4" height="3"/>
        <rect class="bub-dot" x="52" y="-19" width="5" height="5"/>
        <rect class="bub-dot" x="61" y="-19" width="5" height="5"/>
        <rect class="bub-dot" x="70" y="-19" width="5" height="5"/>
      </g>
      <text id="zzz" x="78" y="-4">z</text>
    </svg>

    <div id="badge"></div>
  </div>

  <!-- opens on hover, beside the crab: usage on the left, active agents on the right -->
  <div id="panel" hidden>
    <div class="col usage-col">
      <div class="row">
        <span class="dot claude"></span><span class="label">5-hour</span>
        <span class="value" id="p-session">-</span>
        <span class="sub" id="p-session-sub"></span>
      </div>
      <div class="row">
        <span class="dot claude dim"></span><span class="label">Weekly</span>
        <span class="value" id="p-week">-</span>
        <span class="sub" id="p-week-sub"></span>
      </div>
      <div id="p-extra"></div>
      <div class="sub eta" id="p-eta">-</div>
      <button id="login-btn" hidden>Sign in to Claude</button>
      <div id="p-status"></div>
    </div>
    <div class="col agents-col">
      <div class="board-head"><span>Agents</span><span class="board-count" id="board-count"></span></div>
      <div id="sessions"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
